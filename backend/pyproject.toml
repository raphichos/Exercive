[project]
name = "exercive-backend"
version = "0.1.0"
description = "API for Exercive, a workout planner."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: real errors, I: import order, UP: modern syntax, B: likely bugs.
# D and ANN enforce the project rule that everything has a docstring and type hints.
select = ["E", "F", "I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
